name: Deploy

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time, in order — a queued newer deploy must not be
# cancelled (its migrations may already be applied by the time the older
# one finishes).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workers-pool integration tests read secrets from .dev.vars
      # (gitignored) — any structurally valid KEK works, tests provision
      # their own tenant DEKs wrapped by whatever KEK is present.
      - name: Create throwaway .dev.vars for tests
        run: |
          {
            echo "KEK_V1=$(openssl rand -base64 32)"
            echo "GITHUB_CLIENT_SECRET=ci-placeholder"
            echo "DASHBOARD_URL=http://localhost:5173"
          } > apps/api/.dev.vars
      - run: pnpm -r typecheck
      - run: pnpm -r test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f9592092c1e8cfe4a09f5c4cf8188ecc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dashboard
        run: pnpm --filter @extport/dashboard build
      # Migrations first, then code — additive migrations mean old code on
      # new schema is safe for the brief window in between.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply extport --remote
      - name: Deploy Worker (API + dashboard assets)
        working-directory: apps/api
        run: npx wrangler deploy
